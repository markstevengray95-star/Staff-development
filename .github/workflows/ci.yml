name: Validate Staff Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit routes and migration integrity
        run: npm run audit:platform
      - name: Audit concise course content and saved progress
        run: npm run audit:courses
      - name: Build application
        run: npm run build
